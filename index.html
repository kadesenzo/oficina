
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kaenpro - Elite Garage Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
      // Polyfill crucial para evitar crash de 'process is not defined'
      window.process = { env: { API_KEY: "" } };
    </script>
    <style>
        :root {
            --brand-red: #E11D48;
            --bg-main: #0B0B0B;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .active-glow { box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.4); }
        .glow-red { box-shadow: 0 0 20px rgba(225, 29, 72, 0.2); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "recharts": "https://esm.sh/recharts@2.13.3",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.0",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "@google/genai": "https://esm.sh/@google/genai@0.21.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0B0B0B; gap: 20px;">
            <div style="width: 30px; height: 30px; border: 3px solid #1F1F1F; border-top-color: #E11D48; border-radius: 50%; animation: spin 0.6s linear infinite;"></div>
            <div style="font-family: 'Inter', sans-serif; font-weight: 900; color: #3F3F46; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; margin-left: 0.4em;">Kaenpro Engine</div>
        </div>
    </div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
